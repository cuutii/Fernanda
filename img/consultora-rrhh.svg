<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="tituloIlustracion descIlustracion">
  <title id="tituloIlustracion">Ilustración de trabajo en equipo</title>
  <desc id="descIlustracion">Composición abstracta en tonos de verde azulado: un gráfico de barras ascendente a la izquierda y tres figuras humanas a la derecha.</desc>

  <!-- Fondo y marco -->
  <rect width="640" height="460" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="459" rx="15.5" fill="none" stroke="#e0e0e0"/>

  <!-- Sutil de fondo -->
  <circle cx="490" cy="150" r="130" fill="#f9f9fb"/>

  <!-- Línea de tendencia -->
  <polyline points="82,255 162,215 242,165 320,125"
            fill="none" stroke="#004d40" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="320" cy="125" r="11" fill="#004d40"/>

  <!-- Barras de crecimiento -->
  <rect x="70" y="285" width="56" height="104" rx="8" fill="#b2dfdb"/>
  <rect x="150" y="245" width="56" height="144" rx="8" fill="#80cbc4"/>
  <rect x="230" y="195" width="56" height="194" rx="8" fill="#00796b"/>

  <!-- Personas -->
  <g>
    <circle cx="440" cy="230" r="30" fill="#80cbc4"/>
    <rect x="405" y="272" width="70" height="117" rx="35" fill="#80cbc4"/>
  </g>
  <g>
    <circle cx="515" cy="203" r="34" fill="#00796b"/>
    <rect x="475" y="251" width="80" height="138" rx="40" fill="#00796b"/>
  </g>
  <g>
    <circle cx="586" cy="246" r="26" fill="#4db6ac"/>
    <rect x="558" y="284" width="56" height="105" rx="28" fill="#4db6ac"/>
  </g>

  <!-- Línea de base -->
  <rect x="50" y="392" width="540" height="6" rx="3" fill="#e0e0e0"/>
</svg>
